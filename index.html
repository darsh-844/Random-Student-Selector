<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Student Selector</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Helvetica, sans-serif;
            background: #6db0f3;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 700px;
            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Selected student box */

        .selected {
            margin: 25px 0;
            padding: 25px;

            background: #eef3ff;
            border-radius: 10px;
        }

        .selected h2 {
            margin-bottom: 10px;
        }

        #studentName {
            font-size: 28px;
            font-weight: bold;
        }

        #rollNo {
            margin-top: 5px;
            color: #555;
        }

        /* Buttons */

        button {
            padding: 12px 25px;

            font-size: 16px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .reset {
            margin-left: 10px;
            background: #dc2626;
        }

        .reset:hover {
            background: #b91c1c;
        }

        /* Student list */

        .student-list {
            margin-top: 30px;
            text-align: left;
        }

        .student-list h2 {
            margin-bottom: 10px;
        }

        .student {
            display: grid;

            grid-template-columns: 80px 1fr 100px;

            padding: 12px 15px;

            border-bottom: 1px solid #ddd;
        }

        /* Header */

        .student.header {
            font-weight: bold;
            background: #e5e7eb;

            border-radius: 6px 6px 0 0;
        }

        /* Picked student */

        .student.picked {
            background: #d1fae5;
            font-weight: bold;
        }

        /* Tab */
        @media (max-width: 1024px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
                border-radius: 12px;
            }

            .selected {
                margin: 20px 0;
            }

            button {
                width: 100%;
                margin: 5px 0;
            }

            .reset {
                margin-left: 0;
            }

            .student {
                padding: 10px;
            }
        }

        /* Mobile */

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 15px 10px;
            }

            .selected {
                padding: 18px 10px;
            }

            #studentName {
                font-size: 24px;
            }

            .student {
                grid-template-columns: 65px 1fr 120px;
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Random Student Selector</h1>


        <!-- Selected Student -->

            <h2>Selected Student</h2>

            <div id="studentName">
                Click the button!
            </div>

            <div id="rollNo"></div>

        </div>


        <!-- Buttons -->

        <button onclick="pickStudent()">
            Pick Random Student
        </button>

        <button class="reset" onclick="resetSelection()">
            Reset
        </button>


        <!-- Student List -->

        <div class="student-list">

        /*
            Students already selected
        */

        let pickedStudents = [];

        /*
            Sort students by Roll No.
        */

        students.sort((a, b) => a.rollNo - b.rollNo);

        /*
            Display students
        */

        function displayStudents() {

            const list = document.getElementById("studentList");

            list.innerHTML = "";


            // Table header

            const header = document.createElement("div");

            header.classList.add("student", "header");

            header.innerHTML = `
                <span>Serial No.</span>
                <span>Name</span>
                <span>Roll No.</span>
            `;

            list.appendChild(header);

            /*
                Display every student
            */

            students.forEach((student, index) => {

                const div = document.createElement("div");

                div.classList.add("student");

                // Highlight selected students

                if (pickedStudents.includes(student.rollNo)) {

                    div.classList.add("picked");

                }

                div.innerHTML = `

                    <span>${index + 1}</span>

                    <span>${student.name}</span>

                    <span>${student.rollNo}</span>

                `;

                list.appendChild(div);

            });

        }

        /*
            Pick a random student
        */

        function pickStudent() {

            /*
                Check if all students
                have already been selected.
            */

            if (pickedStudents.length === students.length) {

                document.getElementById("studentName").textContent =
                    "Everyone has been picked!";

                document.getElementById("rollNo").textContent =
                    "Click Reset to start again.";

                return;

            }

            /*
                Find students who haven't
                been selected yet.
            */

            const availableStudents = students.filter(

                student =>
                    !pickedStudents.includes(student.rollNo)

            );

            /*
                Generate random index
            */

            const randomIndex =
                Math.floor(
                    Math.random() * availableStudents.length
                );

            /*
                Get random student
            */

            const selectedStudent =
                availableStudents[randomIndex];

            /*
                Add student to picked list
            */

            pickedStudents.push(
                selectedStudent.rollNo
            );

            /*
                Show selected student
            */

            document.getElementById("studentName").textContent =
                selectedStudent.name;

            document.getElementById("rollNo").textContent =
                "Roll No: " + selectedStudent.rollNo;

            /*
                Update class list
            */

            displayStudents();

        }

        /*
            Reset selection
        */

        function resetSelection() {

            pickedStudents = [];


            document.getElementById("studentName").textContent =
                "Click the button!";


            document.getElementById("rollNo").textContent = "";


            displayStudents();

        }

        /*
            Display class list when
            the page loads.
        */

        displayStudents();

    </script>

</html>
