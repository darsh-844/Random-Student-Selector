<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Student Selector</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Helvetica, sans-serif;
            background: #d071f6;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 700px;
            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Class selector */
        .class-selector {
            margin: 0 auto 20px;
            text-align: left;
        }

        .class-selector label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #classSelect {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        /* Selected student box */

        .selected {
            margin: 25px 0;
            padding: 25px;

            background: #eef3ff;
            border-radius: 10px;
        }

        .selected h2 {
            margin-bottom: 10px;
        }

        #studentName {
            font-size: 28px;
            font-weight: bold;
        }

        #rollNo {
            margin-top: 5px;
            color: #555;
        }

        /* Buttons */

        button {
            padding: 12px 25px;

            font-size: 16px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .reset {
            margin-left: 10px;
            background: #dc2626;
        }

        .reset:hover {
            background: #b91c1c;
        }

        /* Student list */

        .student-list {
            margin-top: 30px;
            text-align: left;
        }

        .student-list h2 {
            margin-bottom: 10px;
        }

        .student {
            display: grid;

            grid-template-columns: 80px 1fr 100px;

            padding: 12px 15px;

            border-bottom: 1px solid #ddd;
        }

        /* Header */

        .student.header {
            font-weight: bold;
            background: #e5e7eb;

            border-radius: 6px 6px 0 0;
        }

        /* Picked student */

        .student.picked {
            background: #d1fae5;
            font-weight: bold;
        }

        /* Tab */
        @media (max-width: 1024px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .container {
                margin-top: 10px;
                border-radius: 12px;
            }

            .selected {
                margin: 20px 0;
            }

            button {
                width: 100%;
                margin: 5px 0;
            }

            .reset {
                margin-left: 0;
            }

            .student {
                padding: 10px;
            }
        }

        /* Mobile */

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 15px 10px;
            }

            .selected {
                padding: 18px 10px;
            }

            #studentName {
                font-size: 24px;
            }

            .student {
                grid-template-columns: 65px 1fr 120px;
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Random Student Selector</h1>


        <!-- Class selector -->
        <div class="class-selector">
            <label for="classSelect">Select Class</label>
            <select id="classSelect" onchange="changeClass()">
                <option value="ECE-3A">ECE-3A</option>
                <option value="ECE-3B">ECE-3B</option>
            </select>
        </div>

        <!-- Selected Student -->

        <div class="selected">

            <h2>Selected Student</h2>

            <div id="studentName">
                Click the button!
            </div>

            <div id="rollNo"></div>

        </div>


        <!-- Buttons -->

        <button onclick="pickStudent()">
            Pick Random Student
        </button>

        <button class="reset" onclick="resetSelection()">
            Reset
        </button>


        <!-- Student List -->

        <div class="student-list">

            <h2 id="classTitle">ECE-3A - Class List</h2>

            <div id="studentList"></div>

        </div>

        const pickedByClass = {

        function getStudents() {
            return classData[currentClass].students;
        }

        function getPickedStudents() {
            return pickedByClass[currentClass];
        }

        function sortStudents() {
            Object.values(classData).forEach(classInfo => {
                classInfo.students.sort((a, b) =>
                    a.rollNo.localeCompare(b.rollNo, undefined, { numeric: true })
                );
            });
        }

        function changeClass() {
            currentClass = document.getElementById("classSelect").value;

            document.getElementById("studentName").textContent = "Click the button!";
            document.getElementById("rollNo").textContent = "";

            document.getElementById("classTitle").textContent =
                currentClass + " - Class List";

            displayStudents();
        }

        function displayStudents() {
            const list = document.getElementById("studentList");
            const students = getStudents();
            const pickedStudents = getPickedStudents();

            list.innerHTML = "";

            const header = document.createElement("div");
            header.classList.add("student", "header");
            header.innerHTML = `
                <span>Serial No.</span>
                <span>Name</span>
                <span>Roll No.</span>
            `;
            list.appendChild(header);

            students.forEach((student, index) => {
                const div = document.createElement("div");
                div.classList.add("student");

                if (pickedStudents.includes(student.rollNo)) {
                    div.classList.add("picked");
                }

                div.innerHTML = `
                    <span>${index + 1}</span>
                    <span>${student.name}</span>
                    <span>${student.rollNo}</span>
                `;

                list.appendChild(div);
            });
        }

        function pickStudent() {
            const students = getStudents();
            const pickedStudents = getPickedStudents();

            if (pickedStudents.length === students.length) {
                document.getElementById("studentName").textContent =
                    "Everyone has been picked!";
                document.getElementById("rollNo").textContent =
                    "Click Reset to start again.";
                return;
            }

            const availableStudents = students.filter(
                student => !pickedStudents.includes(student.rollNo)
            );

            const randomIndex = Math.floor(
                Math.random() * availableStudents.length
            );

            const selectedStudent = availableStudents[randomIndex];

            pickedStudents.push(selectedStudent.rollNo);

            document.getElementById("studentName").textContent =
                selectedStudent.name;

            document.getElementById("rollNo").textContent =
                "Roll No: " + selectedStudent.rollNo;

            displayStudents();
        }

        function resetSelection() {
            pickedByClass[currentClass] = [];

            document.getElementById("studentName").textContent =
                "Click the button!";
            document.getElementById("rollNo").textContent = "";

            displayStudents();
        }

        sortStudents();
        document.getElementById("classTitle").textContent = currentClass + " - Class List";
        displayStudents();
